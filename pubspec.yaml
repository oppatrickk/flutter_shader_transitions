name: shader_transitions
description: >-
  GPU-accelerated shader page transitions for Flutter — diamond, circle iris,
  and wipe with eight sweep directions, optional cover color, and a cinematic
  hold.
version: 0.1.0
homepage: https://johnpatrickprieto.com
repository: https://github.com/oppatrickk/flutter_shader_transitions
issue_tracker: https://github.com/oppatrickk/flutter_shader_transitions/issues

topics:
  - transitions
  - shaders
  - animation
  - navigation
  - ui

# Floor is Dart 3.0 / Flutter 3.10 — the lowest that supports the Dart 3
# records & patterns used in lib/ (SweepDirectionVector, _setUniforms) plus
# ui.FragmentProgram.fromAsset (stable since Flutter 3.7).
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  shaders:
    - shaders/diamond.frag
    - shaders/circle.frag
    - shaders/wipe.frag
