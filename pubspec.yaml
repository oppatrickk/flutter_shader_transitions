name: shader_transitions
description: >-
  GPU-accelerated, shader-based page transitions for Flutter — diamond grid,
  circle iris, and linear wipe with eight sweep directions, optional cover
  color, and a configurable hold for cinematic fade-through transitions.
version: 0.0.1
homepage: https://johnpatrickprieto.com
repository: https://github.com/oppatrickk/flutter_shader_transitions
issue_tracker: https://github.com/oppatrickk/flutter_shader_transitions/issues

topics:
  - transitions
  - shaders
  - animation
  - navigation
  - ui

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  shaders:
    - shaders/diamond.frag
    - shaders/circle.frag
    - shaders/wipe.frag
