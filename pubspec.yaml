name: shader_transitions
description: >-
  GPU-accelerated shader page transitions for Flutter — diamond, circle iris,
  and wipe with eight sweep directions, optional cover color, and a cinematic
  hold.
version: 1.1.0
homepage: https://johnpatrickprieto.com
repository: https://github.com/oppatrickk/flutter_shader_transitions
issue_tracker: https://github.com/oppatrickk/flutter_shader_transitions/issues

topics:
  - transitions
  - shaders
  - animation
  - navigation
  - ui

# Floor is Flutter 3.22 / Dart 3.4 — the first with PageRoute.popGestureEnabled,
# which ShaderPageRoute's iOS back swipe uses to refuse the gesture wherever a
# pop would be refused (PopScope, first route, fullscreen dialog). lib/ also
# needs Dart 3 records & patterns and ui.FragmentProgram.fromAsset.
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  shaders:
    - shaders/diamond.frag
    - shaders/circle.frag
    - shaders/wipe.frag
    - shaders/clock.frag
    - shaders/polygon.frag
    - shaders/dissolve.frag
    - shaders/fade.frag
    - shaders/bars.frag
