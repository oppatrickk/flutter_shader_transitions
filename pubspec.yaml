name: shader_transitions
description: GPU-accelerated shader-based transitions for Flutter.
version: 0.1.0
# homepage: https://github.com/yourname/shader_transitions

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  shaders:
    - shaders/dissolve.frag
    - shaders/diamond.frag
    # - shaders/wipe.frag
    # - shaders/glitch.frag
